[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jcaneleir-searchrank_jd143"
version = "0.1.0"
description = "抽取数值做分布分析，用中位数绝对偏差识别搜索排序算法工程师·结构化输出的约束解码上的离群点"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "jcaneleir" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://jcaneleir.github.io"
Repository = "https://github.com/jcaneleir/searchrank_jd143"
Issues = "https://github.com/jcaneleir/searchrank_jd143/issues"

[project.scripts]
searchrank_jd143 = "searchrank_jd143:main"

[tool.setuptools]
py-modules = ["searchrank_jd143"]
